name: Prototype validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt playwright==1.62.0
      # The runner image already has Chromium's system libraries; --with-deps only adds optional fonts
      # from a mirror that sometimes stalls for many minutes. Install system packages only if Chromium cannot start.
      - name: Install Chromium
        shell: bash
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            python -m playwright install-deps chromium
          fi
      - name: Run all browser workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          for path in sorted(Path('tests').glob('browser_*.py')):
              print(path, flush=True)
              subprocess.run([sys.executable, str(path)], check=True)
          PY
