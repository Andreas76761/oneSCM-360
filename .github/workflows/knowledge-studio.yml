name: Knowledge Studio
on:
  push:
    branches: [main]
    paths: ['onescm360_app_build/**', '.github/workflows/knowledge-studio.yml']
  pull_request:
    paths: ['onescm360_app_build/**', '.github/workflows/knowledge-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: knowledge-studio-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: onescm360_app_build
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt python-docx==1.2.0  # python-docx only to verify the generated Word templates
      - run: python -m unittest discover -s tests -v
      - name: Parse start_onescm360.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'start_onescm360.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt playwright==1.62.0
      # The runner image already has Chromium's system libraries; --with-deps only adds optional fonts
      # from a mirror that sometimes stalls for many minutes. Install system packages only if Chromium cannot start.
      - name: Install Chromium
        shell: bash
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            python -m playwright install-deps chromium
          fi
      - run: python tests/browser_workflow.py
